services:
  app:
    build: .
    ports: ["7860:7860"]
    environment:
      OLLAMA_API_BASE: http://ollama:11434
    depends_on: [ollama]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
volumes:
  ollama: